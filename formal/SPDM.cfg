# Formal run of SPDM_top (scripts/formal/run_formal.sh SPDM): the SHA3-384
# transcript engines and ML-DSA are cut under FORMAL (their outputs are free
# values, see rtl/SPDM_top.sv) and the stores are shrunk (2 measurement
# indices, a 64-byte certificate chain), so only the SPDM control is checked.
# Depth 24 takes a short request through decode into the response.
PARAMS="NM=2 CC_AW=6"
DEPTH=24
INDUCT=4
