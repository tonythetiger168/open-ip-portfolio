# Formal run of TRNG_top (scripts/formal/run_formal.sh TRNG): an 8-sample
# adaptive proportion window, so the bound covers start-up tests that pass
# and fail, restarts, and the first collection clocks. Depth 20 takes about
# 20 minutes (the SHA-256 datapath is in the cone at every step).
PARAMS="APT_WL=3"
DEPTH=20
INDUCT=0
