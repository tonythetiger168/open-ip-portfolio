# Formal run of PCIe_CXL_IDE_top (scripts/formal/run_formal.sh PCIe_CXL_IDE):
# a 3-bit invocation counter (exhaustion within reach) and short length
# counters; the AES_GCM_top engines use their FORMAL short AES (2 / 3 rounds,
# identity S-box) and their own properties are proven along with these
FILES="rtl/AES_GCM_top.sv"
PARAMS="NS=1 CTR_W=3 LEN_W=8"
DEPTH=10
INDUCT=4
