name: regression

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A newer push supersedes the run in progress on the same branch / PR.
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IVERILOG_VERSION: v13_0

jobs:
  sim-syn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Ubuntu ships iverilog 12, which accepts a net used above its
      # declaration (issue #25); build the pinned 13.0 release once and cache it.
      - id: iverilog-cache
        uses: actions/cache@v4
        with:
          path: ~/iverilog
          key: iverilog-${{ env.IVERILOG_VERSION }}-${{ runner.os }}

      - name: Install open toolchain (yosys from apt, iverilog 13.0 from source)
        run: |
          sudo apt-get update && sudo apt-get install -y yosys autoconf gperf flex bison g++ make
          if [ ! -x "$HOME/iverilog/bin/iverilog" ]; then
            git clone -b "$IVERILOG_VERSION" --depth 1 https://github.com/steveicarus/iverilog.git /tmp/iverilog
            cd /tmp/iverilog
            sh autoconf.sh && ./configure --prefix="$HOME/iverilog" && make -j"$(nproc)" && make install
          fi
          echo "$HOME/iverilog/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: iverilog -V 2>&1 | head -1 && yosys -V

      - name: Generated files are up to date (APB wrappers, TBs, IP pages, filelists)
        run: |
          pip install --break-system-packages pyslang==12.0.0
          python3 scripts/apb/gen_apb.py --all > /dev/null
          python3 scripts/gen_filelists.py
          git status --short
          git diff --exit-code --stat

      - name: Design specs cover every port, parameter, internal probe and TB check (docs/spec)
        run: python3 scripts/spec/gen_spec.py --check

      - name: Strict IEEE 1800 elaboration of all RTL (slang; catches what iverilog accepts)
        run: python3 scripts/lint/strict_elab.py

      - name: Full regression (every protocol, sim + syn + apb, in parallel)
        run: bash scripts/ci_regression.sh

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: work/ci_*.log
          retention-days: 7

  # Every IP (core and APB wrapper) must pass a strict Yosys flow: no latches,
  # no multiple / missing drivers or combinational loops (check -assert), and
  # a full synth down to gates with ABC. Runs next to sim-syn.
  yosys-strict:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install yosys
        run: sudo apt-get update && sudo apt-get install -y yosys && yosys -V

      - name: Strict Yosys synthesis of every IP
        run: python3 scripts/lint/yosys_strict.py

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yosys-strict-logs
          path: work/yosys_strict/*.log
          retention-days: 7
